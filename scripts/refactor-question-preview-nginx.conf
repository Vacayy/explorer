pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  access_log off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    location = /api/spine/questions {
      proxy_pass http://explorer-refactor-single-path:8000;
      proxy_read_timeout 300s;
    }
    location ~ ^/api/spine/doc/[0-9]+/digest$ {
      proxy_pass http://explorer-refactor-single-path:8000;
      proxy_read_timeout 300s;
    }
    location /api/ {
      proxy_pass http://explorer-refactor-single-gateway:8080;
      proxy_read_timeout 300s;
    }
    location /media/ { proxy_pass http://explorer-refactor-single-gateway:8080; }
    location / { try_files $uri $uri/ /index.html; }
  }
}

pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = /__preview-info {
      default_type text/plain;
      return 200 'Local refactor preview. The rehearsal snapshot is older than the MacBook; last recorded document fetch: 2026-11-14 09:37:32 (timezone not recorded). Feed, document, signal, narrative list/detail and transcript detail/quarters use disposable PostgreSQL. Home, related documents, transcript follow/recent, industry and media use the existing read-only viewer. Other APIs and all writes are unavailable. Search is lexical. This is not an operating cutover. Stop using scripts/stop-refactor-preview.sh in explorer-refactor.\n';
    }
    location ~ ^/api/spine/(feed(?:/timeline|/channels)?|doc/[0-9]+(?:/claims)?|signals(?:/summary|/momentum)?|narrative(?:/list)?|transcript/(?:company/[^/]+|detail/[0-9]+))$ {
      add_header X-Preview-Backend postgres always;
      proxy_pass http://preview-api:8000;
      proxy_read_timeout 90s;
    }
    location ~ ^/api/(?:spine/industry/(?:map|us/map|us/[^/]+|[^/]+(?:/peers)?)|spine/sector-map/peers|peers/runtime)$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location ~ ^/api/spine/(?:home(?:/ai-activity)?|transcript/(?:follow|recent))$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location ~ ^/api/spine/doc/[0-9]+/related$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location /media/ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location /api/ { return 404; }
    location / { root /srv/explorer; try_files $uri $uri/ /index.html; }
  }
}

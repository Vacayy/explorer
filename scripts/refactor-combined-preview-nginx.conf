pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map "$request_method:$uri" $deny_preview_method {
    default 1;
    ~^(GET|HEAD): 0;
    "POST:/api/spine/ask" 0;
    ~^POST:/api/spine/doc/[0-9]+/digest$ 0;
  }
  server {
    listen 8080;
    if ($deny_preview_method) { return 405; }
    location = /__preview-info {
      default_type text/plain;
      return 200 'Local refactor preview. The rehearsal snapshot is older than the MacBook; last recorded document fetch: 2026-11-14 09:37:32 (timezone not recorded). Feed and document use a durable PG generation derived from the rehearsal snapshot and include a clearly labeled synthetic collection test. Signal, narrative, industry, transcript, Market-today and the local owner portfolio use the earlier PG snapshot; they are a separate generation. Peer was captured separately. Home, transcript season, related documents and media use the existing read-only viewer. Related document candidates come from that earlier corpus and are not the current feed generation. Admin jobs, runs and observation show the older snapshot, not current operating status. Chat and matching video digests use a separate writable SQLite rehearsal snapshot and may invoke the configured model; changes do not reach the MacBook or PG feed. Other writes are unavailable. Search is lexical. This is not an operating cutover. Do not run scripts/stop-refactor-preview.sh while this combined preview exists.\n';
    }
    location = /api/spine/market-today {
      add_header X-Preview-Backend postgres always;
      proxy_pass http://explorer-refactor-durable-candidate:8000;
    }
    location ~ ^/api/spine/(feed(?:/timeline|/channels)?|doc/[0-9]+/claims|signals(?:/summary|/momentum)?|narrative(?:/list)?|transcript/(?:momentum|follow|recent|company/[^/]+|detail/[0-9]+))$ {
      add_header X-Preview-Backend postgres always;
      proxy_pass http://explorer-refactor-durable-candidate:8000;
      proxy_read_timeout 90s;
    }
    location ~ ^/api/(?:spine/industry/(?:map|us/map|us/[^/]+|[^/]+(?:/peers)?)|spine/sector-map/peers|peers/runtime)$ {
      add_header X-Preview-Backend postgres always;
      proxy_pass http://explorer-refactor-durable-candidate:8000;
    }
    location ~ ^/api/spine/(?:home(?:/ai-activity)?|transcript/(?:follow|recent|season|collect/status))$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    # Pure saved-data calls against the older viewer snapshot. The adapter
    # rejects force refresh and has no collection endpoints or writable mount.
    location ~ ^/api/spine/(?:macro|market-regime|us/briefing)$ {
      add_header X-Preview-Backend existing-snapshot-readonly always;
      proxy_pass http://explorer-refactor-saved-home:8000;
      proxy_read_timeout 90s;
    }
    # These saved home widgets come from the older read-only viewer; that
    # viewer disables the indices background refresh and mounts data read-only.
    # Never forward force=true, which would start an external refresh.
    location = /api/spine/kr/movers {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080/api/spine/kr/movers?force=false;
    }
    location ~ ^/api/spine/(?:credit|home/predictions|indices(?:/breadth)?|market/(?:kr|us)/overview|risk|world/changes)$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    # The original shell loads these read-only lists on every page. The
    # referenced viewer mounts its database and auxiliary files read-only.
    location ~ ^/api/spine/(?:admin/health|approvals|groups(?:/default-watch)?|saved|study-projects)$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    # Saved reads from the older rehearsal viewer; this local preview is not
    # an operating cutover and the viewer snapshot can lag the PG feed.
    location ~ ^/api/spine/(?:trade/(?:grid|follow|highlights)|person/home|thesis/(?:audits|[0-9]+)|sources/health|tw/(?:revenue|links|value-chain|confirm|propagation|flow|expectations))$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location ~ ^/api/spine/(?:actions|retail|trend-leaders|pricing|regimes(?:/(?:state|commentary))?|tracker/status|groups/[0-9]+/digests|tw/(?:chain-report/(?:preview|[0-9]+)|chain-reports)|curation|client-errors)$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    # Thesis reads from the older rehearsal snapshot. GET question detail is
    # deliberately excluded: the original handler updates last_viewed_at.
    location ~ ^/api/spine/(?:narrative-candidates|world/(?:big-picture|contested)|causal/worldview/(?:core|index|neighborhood/[0-9]+)|questions|studies(?:/[0-9]+(?:/actions)?)?|study-projects/[0-9]+|report(?:/(?:list|history|version))?)$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location ~ ^/api/spine/(?:transcript/chain/(?:[0-9]+|upcoming/[A-Za-z0-9.%-]+)|person/[0-9]+)$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location ~ ^/api/spine/questions/[0-9]+$ {
      add_header X-Preview-Backend historical-snapshot always;
      proxy_pass http://explorer-refactor-saved-admin:8000;
    }
    location ~ ^/api/stock-prices/[0-9A-Za-z.%-]+$ {
      add_header X-Preview-Backend historical-snapshot always;
      proxy_pass http://explorer-refactor-saved-admin:8000;
    }
    location ~ ^/api/(?:consensus/[0-9A-Za-z.%-]+/history|spine/questions/(?:proxy/[0-9]+|[0-9]+/synthesis))$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    # Chat reads and writes must share the same isolated SQLite generation.
    # The API has no published port except localhost and is never public.
    location ~ ^/api/spine/(?:ask|chat/targets|conversations(?:/[0-9]+(?:/stream)?)?)$ {
      add_header X-Preview-Backend isolated-chat-snapshot always;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_pass http://explorer-refactor-chat-write-rehearsal:8000;
    }
    # Current document reads can overlay a matching video digest from the
    # isolated writer; pinned PG generations remain immutable.
    location ~ ^/api/spine/doc/[0-9]+(?:/digest)?$ {
      add_header X-Preview-Backend document-with-isolated-digest always;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-refactor-chat-write-rehearsal:8000;
    }
    # The viewer disables the analysis worker. These routes only read its
    # saved run history and strategy catalog; starting a run remains blocked.
    location ~ ^/api/analysis/(?:strategies|runs)$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    # Historical data only, never live job status or control. This preview is
    # bound to localhost and the saved-admin container has a read-only DB.
    location ~ ^/api/spine/admin/(?:jobs|runs|observe)$ {
      add_header X-Preview-Backend historical-snapshot always;
      proxy_pass http://explorer-refactor-saved-admin:8000;
      proxy_read_timeout 90s;
    }
    # The saved season reader recomputes stale core classifications without writes.
    location = /api/spine/transcript/season {
      add_header X-Preview-Backend existing-snapshot-readonly always;
      proxy_pass http://explorer-refactor-saved-season:8000;
      proxy_read_timeout 120s;
    }
    location ~ ^/api/spine/transcript/season/sector/[^/]+$ {
      add_header X-Preview-Backend existing-snapshot-readonly always;
      proxy_pass http://explorer-refactor-saved-season:8000;
      proxy_read_timeout 120s;
    }
    # These company detail reads are available in the older viewer snapshot.
    location ~ ^/api/spine/(?:feed/(?:company-evidence|company-prices)|technical-scan/[A-Za-z0-9.%-]+)$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    # Season details are still served by the older read-only viewer.
    location = /api/spine/transcript/season/kr {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location = /__internal/related-check {
      internal;
      proxy_pass_request_body off;
      proxy_set_header Content-Length '';
      proxy_pass http://explorer-refactor-durable-candidate:8000/__preview/related-base-check/$related_doc?generation=$arg_generation;
    }
    location @related-unavailable { return 503; }
    location ~ ^/api/spine/doc/(?<related_doc>[0-9]+)/related$ {
      auth_request /__internal/related-check;
      error_page 403 = @related-unavailable;
      add_header X-Preview-Backend existing-viewer always;
      add_header X-Preview-Related-Corpus prior-viewer-snapshot always;
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    # Local owner only: the gateway binds localhost and blocks all writes.
    location = /api/portfolio {
      add_header X-Preview-Backend postgres always;
      proxy_pass http://explorer-refactor-durable-candidate:8000;
      proxy_read_timeout 90s;
    }
    location ~ ^/api/portfolio/(?:history|transactions)$ {
      add_header X-Preview-Backend postgres always;
      proxy_pass http://explorer-refactor-durable-candidate:8000;
      proxy_read_timeout 90s;
    }
    location ~ ^/api/portfolio/(?:exposure|principles(?:/state)?|alerts|events|flow|thesis)$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location /media/ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location /api/ { return 404; }
    location / { root /srv/explorer; try_files $uri $uri/ /index.html; }
  }
}

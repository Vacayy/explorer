pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = /__preview-info {
      default_type text/plain;
      return 200 'Local refactor preview. The rehearsal snapshot is older than the MacBook; last recorded document fetch: 2026-11-14 09:37:32 (timezone not recorded). Feed, document, signal, narrative list/detail, industry and transcript momentum/follow/recent/detail/quarters use one SQLite-snapshot PostgreSQL candidate. Peer was captured separately. Market-today also uses that snapshot. Home, transcript season, related documents and media use the existing read-only viewer. Other APIs and all writes are unavailable. Search is lexical. This is not an operating cutover. Do not run scripts/stop-refactor-preview.sh while this combined preview exists.\n';
    }
    location = /api/spine/market-today {
      add_header X-Preview-Backend postgres always;
      proxy_pass http://explorer-refactor-momentum-candidate:8000;
    }
    location ~ ^/api/spine/(feed(?:/timeline|/channels)?|doc/[0-9]+(?:/claims)?|signals(?:/summary|/momentum)?|narrative(?:/list)?|transcript/(?:momentum|follow|recent|company/[^/]+|detail/[0-9]+))$ {
      add_header X-Preview-Backend postgres always;
      proxy_pass http://explorer-refactor-momentum-candidate:8000;
      proxy_read_timeout 90s;
    }
    location ~ ^/api/(?:spine/industry/(?:map|us/map|us/[^/]+|[^/]+(?:/peers)?)|spine/sector-map/peers|peers/runtime)$ {
      add_header X-Preview-Backend postgres always;
      proxy_pass http://explorer-refactor-momentum-candidate:8000;
    }
    location ~ ^/api/spine/(?:home(?:/ai-activity)?|transcript/(?:follow|recent|season|collect/status))$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    # Pure saved-data calls against the older viewer snapshot. The adapter
    # rejects force refresh and has no collection endpoints or writable mount.
    location ~ ^/api/spine/(?:macro|market-regime|us/briefing)$ {
      add_header X-Preview-Backend existing-snapshot-readonly always;
      proxy_pass http://explorer-refactor-saved-home:8000;
      proxy_read_timeout 90s;
    }
    # These saved home widgets come from the older read-only viewer; that
    # viewer disables the indices background refresh and mounts data read-only.
    location ~ ^/api/spine/(?:credit|home/predictions|indices(?:/breadth)?|market/kr/overview|risk|world/changes)$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    # The original shell loads these read-only lists on every page. The
    # referenced viewer mounts its database and auxiliary files read-only.
    location ~ ^/api/spine/(?:admin/health|approvals|groups(?:/default-watch)?|saved|study-projects)$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    # The saved season reader recomputes stale core classifications without writes.
    location = /api/spine/transcript/season {
      add_header X-Preview-Backend existing-snapshot-readonly always;
      proxy_pass http://explorer-refactor-saved-season:8000;
      proxy_read_timeout 120s;
    }
    location ~ ^/api/spine/transcript/season/sector/[^/]+$ {
      add_header X-Preview-Backend existing-snapshot-readonly always;
      proxy_pass http://explorer-refactor-saved-season:8000;
      proxy_read_timeout 120s;
    }
    # Season details are still served by the older read-only viewer.
    location = /api/spine/transcript/season/kr {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location ~ ^/api/spine/doc/[0-9]+/related$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    # Local preview only: the original Korean season uses the saved portfolio.
    location = /api/portfolio {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location ~ ^/api/portfolio/(?:history|exposure|principles/state|alerts)$ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_read_timeout 90s;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location /media/ {
      add_header X-Preview-Backend existing-viewer always;
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location /api/ { return 404; }
    location / { root /srv/explorer; try_files $uri $uri/ /index.html; }
  }
}

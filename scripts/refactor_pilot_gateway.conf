# Pilot gateway (architect #3 6937750630): no access decisions here. Which paths open, to whom and for writes is the
# application's candidate access boundary alone (routers.postgres_access_boundary, refused at start when ambiguous).
# This only serves the screens (the single-path build, BUILD_COMMIT at its root), proxies /api and /media to the API,
# and sets the body size and time limits. Kept in the repository; the preview's path lists (18013) are not carried over.
worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  client_max_body_size 25m;         # study documents and image attachments
  upstream api { server explorer-refactor-single-path:8000; }
  server {
    listen 8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;   # the tunnel's https, for secure session cookies
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_buffering off;          # chat, study and analysis event streams
      proxy_read_timeout 960s;      # computations up to 600s, a market analysis run up to 900s
    }
    location /media/ { proxy_pass http://api; }
    location / { root /srv/single; try_files $uri $uri/ /index.html; }
  }
}

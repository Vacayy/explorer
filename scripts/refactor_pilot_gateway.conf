# Pilot gateway (architect #3 6937750630): no access decisions here. Which paths open, to whom and for writes is the
# application's candidate access boundary alone (routers.postgres_access_boundary, refused at start when ambiguous).
# This only serves the screens (the single-path build, BUILD_COMMIT at its root), proxies /api and /media to the API,
# and sets the body size and time limits. Kept in the repository; the preview's path lists (18013) are not carried over.
# Its port is published on 127.0.0.1 only: the host's tunnel connector and the host reach it, nothing else.
worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  client_max_body_size 25m;         # study documents and image attachments
  upstream api { server explorer-refactor-single-path:8000; }
  # The visitor's address: Cloudflare's edge sets CF-Connecting-IP on the tunnel path (a visitor cannot forge it there);
  # a direct local request (no tunnel) is its own peer address. Whatever the client sent as X-Explorer-Client-IP is
  # always replaced, so the app (EXPLORER_TRIAL_TRUSTED_PROXIES = this gateway's network only) cannot be fed a forged one.
  map $http_cf_connecting_ip $explorer_client_ip { "" $remote_addr; default $http_cf_connecting_ip; }
  server {
    listen 8080;
    proxy_set_header Host $host;
    proxy_set_header X-Explorer-Client-IP $explorer_client_ip;
    proxy_set_header X-Forwarded-For $explorer_client_ip;
    proxy_set_header X-Forwarded-Proto https;     # served only through the tunnel (https); never the client's value
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_buffering off;          # chat, study and analysis event streams
      proxy_read_timeout 960s;      # computations up to 600s, a market analysis run up to 900s
    }
    location /media/ { proxy_pass http://api; }
    location / { root /srv/single; try_files $uri $uri/ /index.html; }
  }
}

# Local synthetic fixture only; missing endpoints deliberately return 404.
pid /tmp/nginx.pid;
events {}
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ~ ^/api/spine/(?:feed(?:/timeline|/channels)?|doc/[0-9]+(?:/claims)?)$ {
      proxy_pass http://explorer-synthetic-ui-api:8000;
      proxy_read_timeout 90s;
    }
    location ~ ^/api/spine/(?:admin/health|approvals|groups|saved|study-projects)$ {
      proxy_set_header Host viewer;
      proxy_pass http://explorer-phase1-viewer-check-gateway-1:8080;
    }
    location /api/ { return 404; }
    location / { root /srv/explorer; try_files $uri $uri/ /index.html; }
  }
}
